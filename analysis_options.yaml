include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "flutter_windows_3.47.2-stable/**"
    - "**/flutter_windows_3.47.2-stable/**"
    - "krishimitra omni!/**"
    - "krishimitra_redesign/**"
    - "build/**"
    - "android/**"
    - "ios/**"
    - "web/**"
    - "macos/**"
    - "linux/**"
    - "windows/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
