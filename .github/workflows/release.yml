name: Create GitHub Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env from template if missing
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: KrishiMitra Android App v1.0.0
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📲 KrishiMitra SIH Prototype - Native Android App
            Direct APK download for Android devices.
          draft: false
          prerelease: false
